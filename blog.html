<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Jyotish Digital Darpan | Vedic Astrology Articles</title>
  <meta name="description" content="Read expert articles on Vedic astrology, Kundli analysis, horoscopes, Vastu tips, and spiritual remedies from Jyotish Digital Darpan.">
  <meta name="keywords" content="jyotish blog, vedic astrology articles, kundli tips, horoscope analysis, vastu shastra, astrology remedies">
  <meta property="og:title" content="Blog - Jyotish Digital Darpan">
  <meta property="og:description" content="Expert articles on Vedic astrology, Kundli analysis, and spiritual guidance.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jyotishdigitaldarpan.com/blog">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://jyotishdigitaldarpan.com/blog">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": "Jyotish Digital Darpan Blog",
    "description": "Vedic astrology articles and insights",
    "url": "https://jyotishdigitaldarpan.com/blog",
    "publisher": {
      "@type": "Organization",
      "name": "Jyotish Digital Darpan"
    }
  }
  </script>
</head>
<body>
  <header class="flex justify-between items-center p-6 bg-black bg-opacity-60 fixed top-0 w-full z-50">
    <a href="/" class="text-lg font-semibold text-white">Jyotish Digital Darpan</a>
    <nav class="space-x-4 text-sm">
      <a href="/" class="hover:underline text-gray-300">Home</a>
      <a href="/blog" class="hover:underline text-purple-400 font-semibold">Blog</a>
      <a href="/birth-chart.html" class="hover:underline text-gray-300">Birth Chart</a>
    </nav>
  </header>

  <main class="pt-24 pb-16 px-4 max-w-6xl mx-auto">
    <nav class="text-sm text-gray-400 mb-6">
      <a href="/" class="hover:text-purple-400">Home</a> &gt; <span class="text-gray-300">Blog</span>
    </nav>
    
    <h1 class="text-3xl md:text-4xl font-bold text-white mb-4">Astrology Blog</h1>
    <p class="text-gray-400 mb-8">Explore articles on Vedic astrology, Kundli interpretation, and cosmic wisdom.</p>
    
    <!-- Category Filter -->
    <div class="flex flex-wrap gap-2 mb-8">
      <button class="cat-btn px-4 py-2 rounded-full text-sm bg-purple-600 text-white" data-cat="">All</button>
      <button class="cat-btn px-4 py-2 rounded-full text-sm bg-gray-800 text-gray-300 hover:bg-purple-900" data-cat="Kundli">Kundli</button>
      <button class="cat-btn px-4 py-2 rounded-full text-sm bg-gray-800 text-gray-300 hover:bg-purple-900" data-cat="Horoscope">Horoscope</button>
      <button class="cat-btn px-4 py-2 rounded-full text-sm bg-gray-800 text-gray-300 hover:bg-purple-900" data-cat="Vastu">Vastu</button>
      <button class="cat-btn px-4 py-2 rounded-full text-sm bg-gray-800 text-gray-300 hover:bg-purple-900" data-cat="Remedies">Remedies</button>
      <button class="cat-btn px-4 py-2 rounded-full text-sm bg-gray-800 text-gray-300 hover:bg-purple-900" data-cat="Panchang">Panchang</button>
      <button class="cat-btn px-4 py-2 rounded-full text-sm bg-gray-800 text-gray-300 hover:bg-purple-900" data-cat="Astrology Tips">Tips</button>
      <button class="cat-btn px-4 py-2 rounded-full text-sm bg-gray-800 text-gray-300 hover:bg-purple-900" data-cat="Numerology">Numerology</button>
    </div>
    
    <!-- Blog Grid -->
    <div id="blogGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-gray-500 col-span-3 text-center py-12">Loading blogs...</p>
    </div>
  </main>

  <footer class="text-center text-gray-500 text-sm py-8 border-t border-gray-800">
    <p>Jyotish Digital Darpan - Embrace Celestial Wisdom</p>
  </footer>

  <script>
  (function() {
    "use strict";
    var currentCat = "";
    
    async function loadBlogs(category) {
      var url = "/api/blogs";
      if (category) url += "?category=" + encodeURIComponent(category);
      try {
        var res = await fetch(url);
        var data = await res.json();
        renderBlogs(data.blogs || []);
      } catch(e) {
        document.getElementById("blogGrid").innerHTML = '<p class="text-gray-500 col-span-3 text-center py-12">Failed to load blogs.</p>';
      }
    }
    
    function renderBlogs(blogs) {
      var grid = document.getElementById("blogGrid");
      if (blogs.length === 0) {
        grid.innerHTML = '<p class="text-gray-500 col-span-3 text-center py-12">No blog posts found. Check back soon!</p>';
        return;
      }
      var html = "";
      blogs.forEach(function(b) {
        var readTime = Math.max(1, Math.ceil((b.content || "").split(/\s+/).length / 200));
        html += '<a href="/blog/' + b.slug + '" class="block bg-gray-800 bg-opacity-50 rounded-xl overflow-hidden hover:bg-opacity-70 transition-all hover:transform hover:scale-105">';
        if (b.featuredImage) {
          html += '<img src="' + b.featuredImage + '" alt="' + escAttr(b.title) + '" class="w-full h-48 object-cover">';
        } else {
          html += '<div class="w-full h-48 bg-gradient-to-br from-purple-900 to-indigo-900 flex items-center justify-center text-4xl">&#9789;</div>';
        }
        html += '<div class="p-5">';
        html += '<span class="text-xs text-purple-400 font-semibold uppercase">' + (b.category || "") + '</span>';
        html += '<h2 class="text-lg font-bold text-white mt-2 mb-2">' + escHtml(b.title) + '</h2>';
        html += '<p class="text-sm text-gray-400 mb-3">' + escHtml((b.excerpt || "").slice(0, 120)) + '...</p>';
        html += '<div class="flex justify-between text-xs text-gray-500">';
        html += '<span>' + new Date(b.publishedAt).toLocaleDateString("en-IN", { year:"numeric", month:"short", day:"numeric" }) + '</span>';
        html += '<span>' + readTime + ' min read</span>';
        html += '</div></div></a>';
      });
      grid.innerHTML = html;
    }
    
    function escHtml(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
    function escAttr(s) { return (s || "").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }
    
    // Category filter
    document.querySelectorAll(".cat-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        document.querySelectorAll(".cat-btn").forEach(function(b) {
          b.className = "cat-btn px-4 py-2 rounded-full text-sm bg-gray-800 text-gray-300 hover:bg-purple-900";
        });
        btn.className = "cat-btn px-4 py-2 rounded-full text-sm bg-purple-600 text-white";
        currentCat = btn.dataset.cat;
        loadBlogs(currentCat);
      });
    });
    
    loadBlogs("");
  })();
  </script>
</body>
</html>
