<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lost in the Cosmos | Jyotish Digital Darpan</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AE%3C/text%3E%3C/svg%3E" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0f0c1a;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }
    .container { position: relative; z-index: 1; }
    .emoji { font-size: 80px; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    h1 { font-size: 4rem; font-weight: 700; color: #a855f7; margin-bottom: 0.5rem; }
    p { font-size: 1.2rem; color: #9ca3af; margin-bottom: 2rem; max-width: 500px; }
    a {
      display: inline-block;
      background: #7c3aed;
      color: #fff;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }
    a:hover { background: #5b21b6; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4); }
    .stars {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
      background: radial-gradient(ellipse at bottom, #090611 0%, #0f0c1a 100%);
    }
    .star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle 2s infinite ease-in-out;
    }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="container">
    <div class="emoji">&#128640;</div>
    <h1>404</h1>
    <p>Lost in the cosmos? The page you are looking for has drifted beyond the stars.</p>
    <a href="/">Return Home</a>
  </div>
  <script>
    (function() {
      var container = document.getElementById('stars');
      for (var i = 0; i < 80; i++) {
        var star = document.createElement('div');
        star.className = 'star';
        var size = Math.random() * 2 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 2 + 's';
        container.appendChild(star);
      }
    })();
  </script>
</body>
</html>
